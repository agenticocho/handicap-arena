function renderGrid(highlightSlot){
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns='repeat('+cols+',28px)';
  g.innerHTML='';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      const val=grid[r][c];
      if(val===null){ cell.classList.add('black'); }

      if(deadCells.has(r+','+c)) cell.classList.add('contradiction');
      g.appendChild(cell);
    }
  }
}

    contradictions++;
  }
