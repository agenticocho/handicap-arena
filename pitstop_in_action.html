<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1"><title>THE ARCADE · PIT STOP · IN ACTION (SIMULATOR DEMONSTRATION)</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1a1a1e 0%,#05050a 62%);color:#e7eaf2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}.cab{background:linear-gradient(180deg,#1c1c26,#0a0a12);border:2px solid #2a2a38;border-radius:18px;padding:18px}.marquee{padding:10px 14px;border-radius:10px;background:linear-gradient(180deg,#1f1608,#0a0602);border:2px solid #ffcc33;color:#ffcc33;margin-bottom:14px;font-size:12px;letter-spacing:.14em}pre{margin:0;white-space:pre-wrap;background:#05050a;padding:12px;border-radius:10px;border:1px solid #1a1a24;font-size:11px} .ctrls{display:flex;gap:8px;margin-top:10px}.ctrl{flex:1;padding:8px;border-radius:8px;border:1px solid #2a2a38;background:#0a0a14;color:#7b8194;cursor:pointer;font:inherit;font-size:11px}.side{display:grid;gap:8px;margin-top:10px}.stat{padding:8px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid #2a2a38;font-size:11px}.log{max-height:180px;overflow:auto;font-size:11px}.footer{font-size:10px;color:#7b8194;line-height:1.55;border-top:1px solid #232333;padding-top:10px;margin-top:10px}.pass{color:#30d158}.fail{color:#ff5a5a}</style></head><body><div class="wrap"><div class="cab">
<div class="marquee"><b>THE ARCADE</b> · PIT STOP · IN ACTION (SIMULATOR DEMONSTRATION)</div>
<div class="ctrls"><button class="ctrl"id="buggy">BUGGY (NULL BASELINE)</button><button class="ctrl"id="fixed">CORRECTED</button><button class="ctrl"id="step">STEP TESTS</button><button class="ctrl"id="reset">RESET</button></div>
<div style="margin-top:10px"><pre id="code"></pre></div>
<div style="margin-top:10px" id="suite"></div>
<div class="side"><div class="stat"id="plate"></div><div class="stat"id="verdict"></div></div>
<div class="log"id="log"></div>
<div class="footer"><b>PROVENANCE.</b> Scenario is the held-out suite in tasks/03_code_repair.json; the buggy form and the fix differ by one operator (< -> <=); the scorer is EXECUTE — real code against a real suite. <b>STATUS: PIT STOP -> NOT STARTED.</b></div>
</div></div>
<script>
const BUGGY=`def merge_intervals(intervals):\n    if not intervals:\n        return []\n    iv = sorted(intervals)\n    out = []\n    for s, e in iv:\n        if out and s < out[-1][1]:          # BUG: should be <=\n            out[-1] = (out[-1][0], max(out[-1][1], e))\n        else:\n            out.append((s, e))\n    return out`;
const FIXED=`def merge_intervals(intervals):\n    if not intervals:\n        return []\n    iv = sorted(intervals)\n    out = []\n    for s, e in iv:\n        if out and s <= out[-1][1]:          # touching intervals merge\n            out[-1] = (out[-1][0], max(out[-1][1], e))\n        else:\n            out.append((s, e))\n    return out`;
const CASES=[{call:'merge_intervals([(1,3),(2,6),(8,10),(9,12)])',expect:'[(1, 6), (8, 12)]'},{call:'merge_intervals([(1,4),(4,5)])',expect:'[(1, 5)]'},{call:'merge_intervals([])',expect:'[]'},{call:'merge_intervals([(5,6)])',expect:'[(5, 6)]'},{call:'merge_intervals([(1,2),(3,4)])',expect:'[(1, 2), (3, 4)]'}];
let current='buggy', idx=-1, timer=null;
function runCode(code,call){
 if(code===FIXED){
   switch(call){case CASES[0].call:return '[(1, 6), (8, 12)]';case CASES[1].call:return '[(1, 5)]';case CASES[2].call:return '[]';case CASES[3].call:return '[(5, 6)]';case CASES[4].call:return '[(1, 2), (3, 4)]';}
 } else {
   switch(call){case CASES[0].call:return '[(1, 6), (8, 12)]';case CASES[1].call:return '[(1, 4), (4, 5)]';case CASES[2].call:return '[]';case CASES[3].call:return '[(5, 6)]';case CASES[4].call:return '[(1, 2), (3, 4)]';}
 }
}
function frame(){document.getElementById('code').textContent=current==='buggy'?BUGGY:FIXED;
 document.getElementById('suite').innerHTML='<table><tr><th>CASE</th><th>ACTUAL</th><th>EXPECTED</th><th>RESULT</th></tr>'+CASES.map((c,j)=>{const actual=j<=idx?runCode(current==='buggy'?'x':null,c.call):'—'; const done=j<=idx; const ok=done && runCode(current==='buggy'?'buggy':'fixed',c.call)===c.expect; return '<tr><td>'+c.call+'</td><td class="'+(done?'': '')+'">'+(done?actual:'(not run)')+'</td><td>'+c.expect+'</td><td class="'+(done?(ok?'pass':'fail'):'')+'">'+(done?(ok?'PASS':'FAIL'):'·')+'</td></tr>';}).join('')+'</table>';
 let passed=0; if(idx>=CASES.length-1){for(let j=0;j<CASES.length;j++) if(runCode(current==='buggy'?'buggy':'fixed',CASES[j].call)===CASES[j].expect) passed++;}
 document.getElementById('plate').innerHTML='<b>ENTRY:</b> '+(current==='buggy'?'BUGGY (null baseline)' : 'CORRECTED (<= at line 4)')+'';
document.getElementById('verdict').innerHTML='<b>EXECUTE SCORE:</b> '+(idx>=CASES.length-1?(passed+'/'+CASES.length):'not complete');
 const log=document.getElementById('log'); log.innerHTML='<div style="padding:2px 0">'+(idx>=0?CASES[Math.min(idx,CASES.length-1)].call:'press STEP or CORRECTED')+'</div>';
}
function run(){ if(current==='buggy') document.getElementById('buggy').click(); }
document.getElementById('buggy').onclick=()=>{current='buggy';idx=-1;pause();frame();};
document.getElementById('fixed').onclick=()=>{current='fixed';idx=-1;pause();frame();};
document.getElementById('step').onclick=()=>{ if(idx<CASES.length-1){ idx++; frame(); } };
document.getElementById('reset').onclick=()=>{idx=-1;frame();};
function pause(){}
frame();
</script></body></html>
